documentation:
- changed-files:
  - any-glob-to-any-file: ['doc/**/*', 'examples/**/*']
- head-branch: ['^doc']

maintenance:
- changed-files:
  - any-glob-to-any-file: ['.github/**/*', '.pre-commit-config.yaml']
- head-branch: ['^maint', '^no-ci', '^ci']

enhancement:
- head-branch: ['^feat']

bug:
- head-branch: ['^fix', '^patch']

dependencies:
- changed-files:
  - any-glob-to-any-file: ['pyproject.toml']

ci/cd:
- changed-files:
  - any-glob-to-any-file: ['.github/**/*', 'docker/**/*']
