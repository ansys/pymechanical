documentation:
- changed-files:
  - any-glob-to-any-file: ['doc/**/*', 'examples/**/*']
- head-branch: ['^doc']

maintenance:
- changed-files:
  - any-glob-to-any-file: ['.github/**/*', '.pre-commit-config.yaml']
- head-branch: ['^maint', '^no-ci', '^ci']

enhancement:
- head-branch: ['^feat']

bug:
- head-branch: ['^fix', '^patch']

dependencies:
- changed-files:
  - any-glob-to-any-file: ['pyproject.toml', 'uv.lock']

ci/cd:
- changed-files:
  - any-glob-to-any-file: ['.github/**/*', 'docker/**/*']

ci:
- changed-files:
  - any-glob-to-any-file: ['.github/workflows/**/*', '.github/actions/**/*']

tests:
- changed-files:
  - any-glob-to-any-file: ['tests/**/*']
