name: Labeler
on:
  pull_request:
    # opened, reopened, and synchronize are default for pull_request
    # edited - when PR title or body is changed
    # labeled - when labels are added to PR
    types: [opened, reopened, synchronize, edited, labeled]
  push:
    branches: [ main ]
    paths:
      - '.github/labels.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  label-syncer:
    name: Syncer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # Required to create and manage pull request labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml

  labeler:
    name: Set labels
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write   # Required to apply labels to pull requests
    runs-on: ubuntu-latest
    steps:

    # Label based on changed files and branch name (rules in .github/labeler.yml)
    - name: Label based on changed files and branch name
      uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        sync-labels: false

  commenter:
    name: "Suggest labels if none applied"
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    needs: [labeler]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # Required to comment on pull requests
    steps:
    # The event payload is a snapshot from before the labeler ran, so query the live labels
    - name: Get current labels
      id: labels
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        names=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')
        echo "names=$names" >> "$GITHUB_OUTPUT"

    - name: Suggest to add labels
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      # Execute only when no labels have been applied to the pull request
      if: steps.labels.outputs.names == '[]'
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          Please add one of the following labels to add this contribution to the Release Notes :point_down:
          - [bug](https://github.com/ansys/pymechanical/pulls?q=label%3Abug+)
          - [documentation](https://github.com/ansys/pymechanical/pulls?q=label%3Adocumentation+)
          - [enhancement](https://github.com/ansys/pymechanical/pulls?q=label%3Aenhancement+)
          - [good first issue](https://github.com/ansys/pymechanical/pulls?q=label%3Agood+first+issue)
          - [maintenance](https://github.com/ansys/pymechanical/pulls?q=label%3Amaintenance+)
          - [release](https://github.com/ansys/pymechanical/pulls?q=label%3Arelease+)

  changelog-fragment:
    name: "Create changelog fragment"
    needs: [labeler]
    permissions:
      contents: write        # Required to create changelog fragment files
      pull-requests: write   # Needed to comment on PR with changelog information
    runs-on: ubuntu-latest
    steps:
    - uses: ansys/actions/doc-changelog@87ff2e65e8884121f9afc97728ca9f213228ecc2 # v11.1.4
      with:
        token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
        use-pull-request-title: true
        bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
        bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
