version: 2
updates:

  - package-ecosystem: "uv" # Updates pyproject.toml and uv.lock
    directory: "/" # Location of package manifests
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    pull-request-branch-name:
      separator: "-"
    assignees:
      - "pyansys-ci-bot"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "maintenance"
      - "dependencies"
      - "dependabot"
    ignore:
      # Major protobuf releases must stay aligned with the generated gRPC
      # stubs in ansys-api-mechanical, so update them manually.
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
    groups:
      core:
        patterns:
          - "*ansys*"
          - "appdirs"
          - "click"
          - "clr-loader"
          - "grpcio"
          - "protobuf"
          - "tqdm"
        exclude-patterns:
          - "*sphinx*"
        update-types:
        - "minor"
        - "patch"
      tests:
        patterns:
          - "pytest*"
        exclude-patterns:
          - "*sphinx*"
        update-types:
        - "minor"
        - "patch"
      doc:
        patterns:
          - "*sphinx*"
          - "grpcio"
          - "imageio*"
          - "jupyter*"
          - "matplotlib"
          - "numpy*"
          - "pypandoc"
          - "pythreejs"
          - "pyvista"
        update-types:
        - "minor"
        - "patch"
      # Catch-all group for any dependency not matched by the groups above.
      other:
        patterns:
          - "*"
        update-types:
        - "minor"
        - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    pull-request-branch-name:
      separator: "-"
    assignees:
      - "pyansys-ci-bot"
    labels:
      - "maintenance"
      - "dependencies"
      - "dependabot"
    commit-message:
      prefix: "build(actions)"
    groups:
       actions:
          patterns:
            - "*"
          update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 7
      exclude:
        - "ansys/pre-commit-hooks/*"
    labels:
      - "maintenance"
    commit-message:
      prefix: "build(pre-commit)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    assignees:
      - "koubaa"
      - "samigithub2022"
