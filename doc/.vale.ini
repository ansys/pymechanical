# Core settings
# =============

# Location of our `styles`
StylesPath = "styles"

# The options are `suggestion`, `warning`, or `error` (defaults to “warning”).
MinAlertLevel = warning

# By default, `code` and `tt` are ignored.
IgnoredScopes = code, tt

# By default, `script`, `style`, `pre`, and `figure` are ignored.
SkippedScopes = script, style, pre, figure

# WordTemplate specifies what Vale will consider to be an individual word.
WordTemplate = \b(?:%s)\b

# List of Packages to be used for our guidelines
Packages = Google

# Define the Ansys vocabulary
Vocab = ANSYS

# Lint Python files (docstrings and comments) as Markdown
[formats]
py = md

# Apply the following styles
[*.{rst,md,py}]
BasedOnStyles = Vale, Google
Vale.Terms = NO

# By default, `class` and `func` are ignored
# Python.NET and .NET trigger Google.Spacing (n.N pattern) - ignore them
TokenIgnores = (:class:`.*`|:func:`.*`|Python\.NET|\.NET)

# Skip directive blocks whose content is code or markup rather than prose:
# the directive line plus the indented (or blank) lines that follow it
BlockIgnores = (?m)^\.\. (?:code-block|mermaid|math)::[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*

# Removing Google-specific rule - Not applicable under some circumstances
Google.WordList = NO
Google.Colons = NO

# Sphinx conf.py holds build configuration comments, not user-facing prose
[**/conf.py]
BasedOnStyles =
